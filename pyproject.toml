[project]
name = "vidgen"
version = "0.1.0"
description = "Dynamic Video Generator backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "dramatiq[redis]>=2.2.1",
    "fastapi>=0.146.0",
    "itsdangerous>=2.2.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "psycopg[binary]>=3",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "regex>=2026.9.29",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Pilot only, Apple silicon (DD-31, ADR-012). Not needed for AI_MODE=fake or CI.
local-ai = [
    "torch==2.14.1",
    "torchaudio==2.11.0",
    "torchvision==0.29.1",
    "transformers==5.20.2",
    "accelerate==1.15.0",
    "faster-whisper==1.2.1",
    # chatterbox-tts==0.1.7 itself is installed with --no-deps (scripts/dev_up.sh local mode):
    # its declared pins (torch 2.6.0, transformers 5.2.0, gradio, ...) are stale; these are the tested versions.
    "librosa==0.11.0",
    "s3tokenizer==0.3.0",
    "diffusers==0.29.0",
    "resemble-perth==1.0.1",
    "conformer==0.3.2",
    "safetensors==0.8.0",
    "pykakasi==2.3.0",
    "pyloudnorm==0.2.0",
    "omegaconf==2.0.6",
    "face-alignment==1.5.0",
    "opencv-python-headless==5.0.0.93",
    "numpy==1.26.4",
    "soundfile==0.14.0",
    "setuptools==80.10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/vidgen"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["samples", ".venv-py314-old", "main.py", "scripts", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["vidgen"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend"]
mypy_path = "backend"
explicit_package_bases = true
exclude = ["backend/migrations/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "slow: slow tests (large renders)",
  "e2e: end-to-end tests that need docker compose services",
]

[tool.coverage.run]
source = ["vidgen"]
branch = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-openpyxl>=3.1.5.20261017",
    "types-regex>=2026.9.29.20261017",
]

[tool.uv]
# opencv-python-headless 5.x declares numpy>=2, but the tested stack (Chatterbox, librosa) runs numpy 1.26.4 (DD-31, pilot only).
override-dependencies = [
    "numpy==1.26.4",
    # Never installed: we use opencv-python-headless; pre-commit/virtualenv are dev tooling pulled in by chatterbox deps.
    "opencv-python; sys_platform == 'never'",
    "virtualenv; sys_platform == 'never'",
    "pre-commit; sys_platform == 'never'",
]
